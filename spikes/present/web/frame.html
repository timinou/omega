<!doctype html>
<!-- spikes/present/web/frame.html — pp.frame: rail | conversation | questions,
     every pane a bl-ed editor drawn through presentations. See frame.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>bl-ed · frame (spike)</title>
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./frame.css">
<script type="module" src="./frame.mjs"></script>
</head>
<body data-mode="normal">
  <header id="titlebar">
    <span class="brand">bl<span class="dot">·</span>ed</span>
    <span class="hint"><kbd>j</kbd><kbd>k</kbd> task (rail) &nbsp; <kbd>C-w</kbd><kbd>w</kbd> pane &nbsp; <kbd>J</kbd><kbd>K</kbd> question &nbsp; <kbd>g</kbd><kbd>s</kbd> say &nbsp; <kbd>space</kbd><kbd>t</kbd><kbd>p</kbd> drawing</span>

  <main id="frame">
    <section class="pane" id="rail"><div class="page"><div class="frames"></div><div class="caret"></div><div class="lines"></div></div><div class="pane-status"></div></section>
    <section class="pane" id="pane"><div class="page"><div class="frames"></div><div class="caret"></div><div class="lines"></div></div><div class="pane-status"></div></section>
    <aside id="questions"><div class="label">YOU ASKED</div><div class="list"></div></aside>
  </main>
  <footer><div id="echo"></div><div id="minibuf" hidden></div></footer>
  <textarea id="sink" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
</body>
</html>
